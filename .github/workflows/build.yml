name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # The action's default `tools platform-tools` fails: Google removed
          # the `tools` package from the SDK repository. platform-tools is all
          # we need here; Gradle auto-downloads platforms/build-tools.
          packages: platform-tools

      - name: Accept licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            .gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', '**/*.gradle.kts') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make wrapper executable
        run: chmod +x gradlew

      # `shell: bash` is required: it enables `-o pipefail`, so a failing
      # Gradle run is not masked by `tee` returning 0.
      # Lint is non-blocking until a clean baseline exists (no lint gate has
      # ever run against this tree). Flip to a hard gate once the uploaded
      # report is clean.
      - name: Lint (non-blocking baseline)
        shell: bash
        continue-on-error: true
        run: ./gradlew lintDebug --stacktrace --console=plain 2>&1 | tee -a build.log

      - name: Unit tests
        shell: bash
        run: ./gradlew testDebugUnitTest --stacktrace --console=plain 2>&1 | tee -a build.log

      - name: Assemble debug APK
        shell: bash
        run: ./gradlew assembleDebug --stacktrace --console=plain 2>&1 | tee -a build.log

      - name: Assemble release APK (unsigned)
        shell: bash
        run: ./gradlew assembleRelease --stacktrace --console=plain 2>&1 | tee -a build.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload lint + test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: subul-alhuda-debug
          path: app/build/outputs/apk/debug/*.apk
